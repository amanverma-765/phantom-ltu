name: Android CI/CD

on:
  push:
    branches: [ phantom, main, master ]
  pull_request:
    branches: [ phantom, main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK & CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;29.0.13113456" "cmake;3.22.1"

      - name: Setup Signing Key
        if: ${{ secrets.KEYSTORE_BASE64 != '' || secrets.KEY_STORE != '' }}
        env:
          KEY_STORE: ${{ secrets.KEYSTORE_BASE64 || secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEY_STORE" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"
          {
            echo "androidStoreFile=$GITHUB_WORKSPACE/release.jks"
            echo "androidStorePassword=$KEY_STORE_PASSWORD"
            echo "androidKeyAlias=$KEY_ALIAS"
            echo "androidKeyPassword=$KEY_PASSWORD"
          } >> gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug & Release APKs
        run: ./gradlew buildAll

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phantom-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: phantom-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
