<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="leaflet.min.css">
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        .leaflet-control-zoom,
        .leaflet-control-attribution { display: none !important; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="leaflet.min.js"></script>
    <script>
        var DEFAULT_ZOOM = 10;

        // Initial center is passed via URL hash: #lat,lng
        // Falls back to 0,0 (overridden by Android immediately after mapReady)
        var initLat = 0, initLng = 0;
        if (window.location.hash) {
            var parts = window.location.hash.substring(1).split(',');
            initLat = parseFloat(parts[0]) || 0;
            initLng = parseFloat(parts[1]) || 0;
        }

        var map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([initLat, initLng], DEFAULT_ZOOM);

        var streetsLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            subdomains: '0123',
            maxZoom: 22,
            maxNativeZoom: 20
        });

        var satelliteLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            subdomains: '0123',
            maxZoom: 22,
            maxNativeZoom: 20
        });

        streetsLayer.addTo(map);
        var isSatellite = false;

        var routeLayer = L.layerGroup().addTo(map);

        // Bridge via prompt() — intercepted by WebChromeClient.onJsPrompt
        function bridge(msg) {
            window.prompt(msg);
        }

        var moveDebounceTimer = null;

        map.on('movestart', function () {
            bridge('cameraMoving:true');
        });

        map.on('moveend', function () {
            if (moveDebounceTimer) clearTimeout(moveDebounceTimer);
            moveDebounceTimer = setTimeout(function() {
                var center = map.getCenter();
                bridge('cameraMoving:false');
                bridge('cameraMove:' + center.lat + ':' + center.lng);
            }, 50);
        });

        // Signal ready after layout settles, then send initial position
        setTimeout(function() {
            bridge('mapReady');
            var center = map.getCenter();
            bridge('cameraMove:' + center.lat + ':' + center.lng);
        }, 300);

        function animateCamera(lat, lng, zoom) {
            map.flyTo([lat, lng], zoom, { duration: 1.0 });
        }

        function setSatelliteMode(enabled) {
            if (enabled !== isSatellite) {
                if (enabled) {
                    map.removeLayer(streetsLayer);
                    satelliteLayer.addTo(map);
                } else {
                    map.removeLayer(satelliteLayer);
                    streetsLayer.addTo(map);
                }
                isSatellite = enabled;
            }
        }

        function drawRoute(coordsJson) {
            var coords = JSON.parse(coordsJson);
            routeLayer.clearLayers();
            if (!coords.length) return;

            L.polyline(coords, { color: '#1a73e8', weight: 5, opacity: 0.85 }).addTo(routeLayer);
            L.circleMarker(coords[0], { radius: 6, color: '#0f9d58', fillColor: '#0f9d58', fillOpacity: 1 }).addTo(routeLayer);
            L.circleMarker(coords[coords.length - 1], { radius: 6, color: '#ea4335', fillColor: '#ea4335', fillOpacity: 1 }).addTo(routeLayer);

            map.fitBounds(L.polyline(coords).getBounds(), { padding: [60, 60] });
        }

        function clearRoute() {
            routeLayer.clearLayers();
        }
    </script>
</body>
</html>
